name: API Automation Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. 下载 GitHub 仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. 配置 Java，供 Allure CLI 使用
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. 安装 Allure CLI
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.46.1
          curl -fsSL -o allure-commandline.zip \
            "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.zip"

          mkdir -p "$RUNNER_TEMP/allure-cli"
          unzip -q allure-commandline.zip -d "$RUNNER_TEMP/allure-cli"

          ALLURE_BIN=$(find "$RUNNER_TEMP/allure-cli" -type f -path '*/bin/allure' -print -quit)
          if [ -z "$ALLURE_BIN" ]; then
            echo "Allure executable not found"
            exit 1
          fi

          chmod +x "$ALLURE_BIN"
          echo "$(dirname "$ALLURE_BIN")" >> "$GITHUB_PATH"

      # 5. 安装 Python 项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6. 运行接口自动化测试，生成 Allure 原始结果
      - name: Run API tests
        run: |
          pytest -v --alluredir=allure-results

      # 7. 将原始结果生成 HTML 报告
      - name: Generate Allure HTML report
        if: always()
        run: |
          if [ -d allure-results ] && find allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            allure generate allure-results -o allure-report --clean
          else
            echo "No Allure result files found; skipping report generation."
          fi

      # 8. 上传 Allure 原始结果
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: warn

      # 9. 上传 Allure HTML 报告
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn