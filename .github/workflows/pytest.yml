
name: API Automation Tests

# 当代码推送到 main 分支，或者提交 Pull Request 时触发
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 第一步：下载 GitHub 仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 第三步：安装项目依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 第四步：运行自动化测试
      - name: Run API tests
        run: |
          pytest -v --alluredir=allure-results

      # 第五步：保存 Allure 测试结果
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
